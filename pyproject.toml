[project]
name = "quantachain-backend"
version = "0.1.0"
description = "AI-powered crypto intelligence platform - FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".var", "var", ".venv", ".tests", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# E501 is left to `ruff format` (long string literals in schemas/tool specs are intentional).
ignore = ["E501", "B008", "RUF012", "B904", "RUF001", "RUF002", "RUF003", "RUF006", "ASYNC109", "ASYNC110", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
".tests/*" = ["E501"]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = [".tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
